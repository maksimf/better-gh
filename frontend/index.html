<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111111" />
    <title>BETTER//GH</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="BETTER//GH" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Apply theme BEFORE first paint to avoid a flash of the wrong
      // colors. Saved choice wins; otherwise follow the OS preference.
      (function () {
        try {
          var saved = localStorage.getItem("better-gh.theme");
          var dark =
            saved === "dark" ||
            (!saved &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {
          /* localStorage blocked (private mode) -- fall back to light */
        }
      })();
    </script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/sse.js"></script>
  </head>
  <body hx-ext="sse" sse-connect="/events">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <span class="shape shape--circle"></span>
          <span class="shape shape--square"></span>
          <span class="shape shape--triangle"></span>
        </span>
        <h1 class="brand-title">BETTER<span class="slash">//</span>GH</h1>
      </div>
      <div class="topbar-actions">
        <span class="me">@maksimf</span>
        <button
          type="button"
          class="btn btn--theme"
          id="theme-toggle"
          aria-label="Toggle dark mode"
          title="Toggle dark mode"
        >
          <svg
            class="theme-icon theme-icon--moon"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
              fill="currentColor"
            />
          </svg>
          <svg
            class="theme-icon theme-icon--sun"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <circle cx="12" cy="12" r="4" fill="currentColor" />
            <g
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              fill="none"
            >
              <line x1="12" y1="2.5" x2="12" y2="5" />
              <line x1="12" y1="19" x2="12" y2="21.5" />
              <line x1="2.5" y1="12" x2="5" y2="12" />
              <line x1="19" y1="12" x2="21.5" y2="12" />
              <line x1="4.9" y1="4.9" x2="6.7" y2="6.7" />
              <line x1="17.3" y1="17.3" x2="19.1" y2="19.1" />
              <line x1="4.9" y1="19.1" x2="6.7" y2="17.3" />
              <line x1="17.3" y1="6.7" x2="19.1" y2="4.9" />
            </g>
          </svg>
        </button>
        <button
          type="button"
          class="btn btn--settings"
          id="open-settings"
          aria-haspopup="dialog"
          aria-controls="settings-modal"
        >
          SETTINGS
        </button>
        <button
          class="btn btn--refresh"
          hx-post="/refresh"
          hx-target="#pr-stream"
          hx-swap="innerHTML"
          hx-trigger="click"
          hx-disabled-elt="this"
        >
          REFRESH
        </button>
      </div>
    </header>

    <aside
      id="error-banner"
      class="error-banner"
      hidden
      role="alert"
      aria-live="polite"
      sse-swap="gh-error"
    ></aside>

    <nav class="tabs" role="tablist" aria-label="Dashboard tabs">
      <button
        type="button"
        class="tab is-active"
        id="tab-mine"
        role="tab"
        aria-selected="true"
        aria-controls="panel-mine"
        data-tab="mine"
      >
        MY PRs <span class="tab-count" data-count-for="mine">0</span>
      </button>
      <button
        type="button"
        class="tab"
        id="tab-reviews"
        role="tab"
        aria-selected="false"
        aria-controls="panel-reviews"
        data-tab="reviews"
      >
        REVIEWING <span class="tab-count" data-count-for="reviews">0</span>
      </button>
    </nav>

    <h2 class="page-title" id="page-title">MY PRs</h2>

    <main>
      <section
        id="panel-mine"
        class="tab-panel is-active"
        role="tabpanel"
        aria-labelledby="tab-mine"
      >
        <div class="board">
          <section class="column column--progress" aria-labelledby="col-progress-title">
            <header class="column-header">
              <h2 id="col-progress-title" class="column-title">IN PROGRESS</h2>
              <span class="column-count" data-count-for="progress">0</span>
            </header>
            <div id="col-progress" class="column-body"></div>
          </section>

          <section class="column column--ready" aria-labelledby="col-ready-title">
            <header class="column-header">
              <h2 id="col-ready-title" class="column-title">READY FOR REVIEW</h2>
              <span class="column-count" data-count-for="ready">0</span>
            </header>
            <div id="col-ready" class="column-body"></div>
          </section>

          <section class="column column--approved" aria-labelledby="col-approved-title">
            <header class="column-header">
              <h2 id="col-approved-title" class="column-title">APPROVED</h2>
              <span class="column-count" data-count-for="approved">0</span>
            </header>
            <div id="col-approved" class="column-body"></div>
          </section>
        </div>

        <section class="empty-state" hidden aria-live="polite">
          <div class="empty-state-mark" aria-hidden="true">
            <span class="shape shape--circle"></span>
            <span class="shape shape--square"></span>
            <span class="shape shape--triangle"></span>
          </div>
          <h2 class="empty-state-title">INBOX ZERO</h2>
          <p class="empty-state-sub">No open pull requests. Go touch grass.</p>
        </section>
      </section>

      <section
        id="panel-reviews"
        class="tab-panel"
        role="tabpanel"
        aria-labelledby="tab-reviews"
        hidden
      >
        <div class="reviews-list" id="reviews-list" aria-live="polite"></div>
        <section class="empty-state empty-state--reviews" hidden aria-live="polite">
          <div class="empty-state-mark" aria-hidden="true">
            <span class="shape shape--circle"></span>
            <span class="shape shape--square"></span>
            <span class="shape shape--triangle"></span>
          </div>
          <h2 class="empty-state-title">ALL CLEAR</h2>
          <p class="empty-state-sub">No PRs are waiting for your review.</p>
        </section>
      </section>
    </main>

    <div
      id="pr-stream"
      hidden
      sse-swap="prs"
      hx-get="/prs.html"
      hx-trigger="load, every 300s"
      hx-swap="innerHTML"
    ></div>

    <div
      id="reviews-stream"
      hidden
      sse-swap="reviews"
      hx-get="/reviews.html"
      hx-trigger="load, every 300s"
      hx-swap="innerHTML"
    ></div>

    <aside
      id="last-updated"
      class="footer-meta"
      sse-swap="meta"
      hx-get="/status"
      hx-trigger="load, every 90s"
      hx-swap="innerHTML"
      aria-live="polite"
    ></aside>

    <dialog id="settings-modal" class="settings-modal" aria-labelledby="settings-modal-title">
      <header class="settings-modal-header">
        <span class="brand-mark" aria-hidden="true">
          <span class="shape shape--circle"></span>
          <span class="shape shape--square"></span>
          <span class="shape shape--triangle"></span>
        </span>
        <div class="settings-modal-titles">
          <h2 id="settings-modal-title" class="settings-modal-title">SETTINGS</h2>
          <p class="settings-modal-subtitle">IGNORE REPOS</p>
        </div>
        <button
          type="button"
          class="settings-modal-close"
          id="close-settings"
          aria-label="Close settings"
        >&times;</button>
      </header>
      <div class="settings-modal-body">
        <ul id="settings-repo-list" class="settings-repo-list" aria-live="polite">
          <li class="settings-empty">Loading...</li>
        </ul>
      </div>
      <footer class="settings-modal-footer">
        Stored in your browser. No server-side state.
      </footer>
    </dialog>

    <script>
      // Theme toggle. The pre-paint script in <head> applies the saved /
      // OS-preferred theme before render; this just flips the attribute
      // and persists the user's choice. Storage failures are non-fatal.
      (function () {
        var KEY = "better-gh.theme";
        var btn = document.getElementById("theme-toggle");
        if (!btn) return;

        function currentTheme() {
          return (
            document.documentElement.getAttribute("data-theme") || "light"
          );
        }
        function applyTheme(t) {
          if (t === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
          } else {
            document.documentElement.removeAttribute("data-theme");
          }
          try {
            localStorage.setItem(KEY, t);
          } catch (e) {
            /* private mode -- the preference just won't persist */
          }
        }

        btn.addEventListener("click", function () {
          applyTheme(currentTheme() === "dark" ? "light" : "dark");
        });

        // Follow OS changes only if the user hasn't picked one yet.
        if (window.matchMedia) {
          var mq = window.matchMedia("(prefers-color-scheme: dark)");
          var onChange = function (e) {
            try {
              if (localStorage.getItem(KEY)) return;
            } catch (err) {
              return;
            }
            if (e.matches) {
              document.documentElement.setAttribute("data-theme", "dark");
            } else {
              document.documentElement.removeAttribute("data-theme");
            }
          };
          if (typeof mq.addEventListener === "function") {
            mq.addEventListener("change", onChange);
          } else if (typeof mq.addListener === "function") {
            mq.addListener(onChange);
          }
        }
      })();

      // Ignore-repos store + filter. Persists a Set of "owner/repo" strings
      // in localStorage; falls back to in-memory for private-mode tabs.
      var ignoreStore = (function () {
        var KEY = "better-gh.ignored-repos";
        var memory = new Set();
        function read() {
          try {
            var raw = localStorage.getItem(KEY);
            if (!raw) return new Set();
            var arr = JSON.parse(raw);
            return new Set(Array.isArray(arr) ? arr : []);
          } catch (e) {
            return new Set(memory);
          }
        }
        function write(set) {
          memory = new Set(set);
          try {
            localStorage.setItem(KEY, JSON.stringify(Array.from(set)));
          } catch (e) {
            /* private mode -- keep in-memory copy only */
          }
        }
        return {
          get: read,
          has: function (repo) { return read().has(repo); },
          toggle: function (repo, ignored) {
            var set = read();
            if (ignored) set.add(repo); else set.delete(repo);
            write(set);
            return set;
          },
        };
      })();

      function applyIgnoreFilter() {
        var ignored = ignoreStore.get();
        document
          .querySelectorAll(".pr-card[data-repo], .review-row[data-repo]")
          .forEach(function (card) {
            var repo = card.getAttribute("data-repo");
            card.classList.toggle("is-ignored", ignored.has(repo));
          });
      }

      // Distribute cards from the hidden #pr-stream into the two columns
      // based on each card's data-column attribute. Keeps prs.html a flat
      // list (clean swap target) while the shell owns the two-column layout.
      (function () {
        function visibleChildren(el) {
          var n = 0;
          for (var i = 0; i < el.children.length; i++) {
            if (!el.children[i].classList.contains("is-ignored")) n++;
          }
          return n;
        }

        function distribute() {
          var stream = document.getElementById("pr-stream");
          var progress = document.getElementById("col-progress");
          var ready = document.getElementById("col-ready");
          var approved = document.getElementById("col-approved");
          if (!stream || !progress || !ready || !approved) return;

          var buckets = {
            progress: progress,
            ready: ready,
            approved: approved,
          };
          progress.innerHTML = "";
          ready.innerHTML = "";
          approved.innerHTML = "";

          var cards = stream.querySelectorAll(".pr-card");
          cards.forEach(function (card) {
            var col = card.getAttribute("data-column");
            (buckets[col] || progress).appendChild(card);
          });

          applyIgnoreFilter();

          var counts = {
            progress: visibleChildren(progress),
            ready: visibleChildren(ready),
            approved: visibleChildren(approved),
          };
          counts.mine = counts.progress + counts.ready + counts.approved;

          document
            .querySelectorAll("[data-count-for]")
            .forEach(function (el) {
              var key = el.getAttribute("data-count-for");
              if (key === "reviews") return;
              el.textContent = String(counts[key] || 0);
            });

          var board = document.querySelector(".board");
          var emptyState = document.querySelector(
            "#panel-mine .empty-state:not(.empty-state--reviews)"
          );
          var cols = [
            { key: "progress", el: document.querySelector(".column--progress") },
            { key: "ready",    el: document.querySelector(".column--ready") },
            { key: "approved", el: document.querySelector(".column--approved") },
          ];

          var visibleCols = 0;
          cols.forEach(function (c) {
            if (!c.el) return;
            var hide = counts[c.key] === 0;
            c.el.hidden = hide;
            if (!hide) visibleCols++;
          });

          if (board) {
            board.classList.toggle("board--cols-1", visibleCols === 1);
            board.classList.toggle("board--cols-2", visibleCols === 2);
            board.classList.toggle("board--cols-3", visibleCols === 3);
            board.hidden = visibleCols === 0;
          }
          if (emptyState) emptyState.hidden = visibleCols !== 0;
        }

        window.__betterGhDistribute = distribute;
        document.body.addEventListener("htmx:afterSwap", function (evt) {
          if (evt.target && evt.target.id === "pr-stream") distribute();
        });
      })();

      // Move review rows from the hidden #reviews-stream into the visible
      // list, applying the same ignore filter so a repo unchecked in the
      // settings popup hides reviews from that repo too. Updates the
      // REVIEWING tab count and toggles the empty state.
      (function () {
        function visibleChildren(el) {
          var n = 0;
          for (var i = 0; i < el.children.length; i++) {
            if (!el.children[i].classList.contains("is-ignored")) n++;
          }
          return n;
        }

        function distribute() {
          var stream = document.getElementById("reviews-stream");
          var list = document.getElementById("reviews-list");
          if (!stream || !list) return;

          list.innerHTML = "";
          var rows = stream.querySelectorAll(".review-row");
          rows.forEach(function (row) {
            list.appendChild(row);
          });

          applyIgnoreFilter();

          var visible = visibleChildren(list);
          document
            .querySelectorAll('[data-count-for="reviews"]')
            .forEach(function (el) {
              el.textContent = String(visible);
            });

          var panel = document.getElementById("panel-reviews");
          var emptyState = panel
            ? panel.querySelector(".empty-state--reviews")
            : null;
          if (emptyState) emptyState.hidden = visible !== 0;
          if (list) list.hidden = visible === 0;
        }

        window.__betterGhDistributeReviews = distribute;
        document.body.addEventListener("htmx:afterSwap", function (evt) {
          if (evt.target && evt.target.id === "reviews-stream") distribute();
        });
      })();

      // Tab switcher (MY PRs / REVIEWING). Persists choice in
      // localStorage so a refresh keeps you on the same tab. ARIA
      // attributes update so screen readers stay in sync. Also reflects
      // the active tab in document.title and the visible page heading.
      (function () {
        var KEY = "better-gh.active-tab";
        var TITLE_SUFFIX = " \u00B7 BETTER//GH";
        var LABELS = { mine: "MY PRs", reviews: "REVIEWING" };
        var tabs = document.querySelectorAll(".tab[data-tab]");
        var panels = {
          mine: document.getElementById("panel-mine"),
          reviews: document.getElementById("panel-reviews"),
        };
        var heading = document.getElementById("page-title");
        if (!tabs.length || !panels.mine || !panels.reviews) return;

        function activate(name) {
          if (!panels[name]) name = "mine";
          tabs.forEach(function (t) {
            var match = t.getAttribute("data-tab") === name;
            t.classList.toggle("is-active", match);
            t.setAttribute("aria-selected", match ? "true" : "false");
          });
          Object.keys(panels).forEach(function (k) {
            var match = k === name;
            panels[k].classList.toggle("is-active", match);
            panels[k].hidden = !match;
          });
          var label = LABELS[name] || LABELS.mine;
          document.title = label + TITLE_SUFFIX;
          if (heading) heading.textContent = label;
          try {
            localStorage.setItem(KEY, name);
          } catch (e) {
            /* private mode -- the choice just won't persist */
          }
        }

        tabs.forEach(function (t) {
          t.addEventListener("click", function () {
            activate(t.getAttribute("data-tab") || "mine");
          });
        });

        var saved = "mine";
        try {
          saved = localStorage.getItem(KEY) || "mine";
        } catch (e) {
          /* private mode -- default to MY PRs */
        }
        activate(saved);
      })();

      // Relative-time ticker. Server emits <span data-iso="..."> on the
      // "last updated" footer and on every review row's "requested ..."
      // hint; we recompute the human text on load, after each relevant
      // SSE swap, and once a minute thereafter so nothing goes stale.
      (function () {
        function formatRelative(then) {
          var seconds = Math.max(
            0,
            Math.round((Date.now() - then.getTime()) / 1000)
          );
          if (seconds < 30) return "just now";
          if (seconds < 90) return "1 min ago";
          var minutes = Math.round(seconds / 60);
          if (minutes < 60) return minutes + " mins ago";
          var hours = Math.round(minutes / 60);
          if (hours === 1) return "1 hour ago";
          if (hours < 24) return hours + " hours ago";
          var days = Math.round(hours / 24);
          if (days === 1) return "1 day ago";
          return days + " days ago";
        }

        function tick() {
          document
            .querySelectorAll(
              ".last-updated-relative, .review-requested-relative"
            )
            .forEach(function (el) {
              var iso = el.getAttribute("data-iso");
              if (!iso) return;
              var then = new Date(iso);
              if (isNaN(then.getTime())) return;
              el.textContent = formatRelative(then);
            });
        }

        document.addEventListener("DOMContentLoaded", tick);
        document.body.addEventListener("htmx:afterSwap", function (evt) {
          if (!evt.target) return;
          if (
            evt.target.id === "last-updated" ||
            evt.target.id === "reviews-stream"
          ) {
            tick();
          }
        });
        setInterval(tick, 60_000);
      })();

      // Error banner: surface backend failures (rate limit, etc) and tick
      // the "try again ..." hint until the reset time, then swap the hint
      // for "now". Banner contents come from the server -- this only owns
      // visibility and the relative-time ticker.
      (function () {
        var banner = document.getElementById("error-banner");
        if (!banner) return;

        function pad(n) {
          return n < 10 ? "0" + n : String(n);
        }
        function formatLocalTime(d) {
          return pad(d.getHours()) + ":" + pad(d.getMinutes());
        }
        function formatUntil(then) {
          var seconds = Math.round((then.getTime() - Date.now()) / 1000);
          if (seconds <= 0) return "now (at " + formatLocalTime(then) + ")";
          if (seconds < 60) return "in <1 min (at " + formatLocalTime(then) + ")";
          var minutes = Math.round(seconds / 60);
          if (minutes === 1) return "in 1 min (at " + formatLocalTime(then) + ")";
          if (minutes < 60) {
            return "in " + minutes + " mins (at " + formatLocalTime(then) + ")";
          }
          var hours = Math.round(minutes / 60);
          if (hours === 1) return "in 1 hour (at " + formatLocalTime(then) + ")";
          return "in " + hours + " hours (at " + formatLocalTime(then) + ")";
        }

        function tick() {
          banner.querySelectorAll(".error-banner-relative").forEach(function (el) {
            var iso = el.getAttribute("data-iso");
            if (!iso) return;
            var then = new Date(iso);
            if (isNaN(then.getTime())) return;
            el.textContent = formatUntil(then);
          });
        }

        function syncVisibility() {
          var hasContent = banner.innerHTML.trim().length > 0;
          banner.hidden = !hasContent;
          if (hasContent) tick();
        }

        // HTMX won't swap on 4xx/5xx by default; allow it ONLY when the
        // server explicitly sends an HX-Retarget header. That's how
        // /refresh lands the rate-limit banner in #error-banner without
        // nuking #pr-stream, and it can't accidentally hijack any other
        // error response that happens to have a body.
        document.body.addEventListener("htmx:beforeSwap", function (evt) {
          var xhr = evt.detail && evt.detail.xhr;
          if (!xhr) return;
          if (
            xhr.status >= 400 &&
            xhr.status < 600 &&
            xhr.getResponseHeader("HX-Retarget")
          ) {
            evt.detail.shouldSwap = true;
            evt.detail.isError = false;
          }
        });

        // The htmx SSE extension's swap() does NOT fire htmx:afterSwap
        // (that event is only emitted on the XHR path) -- it only fires
        // htmx:afterSettle. Listen for both so the banner becomes visible
        // whether the HTML arrived via SSE (poller broadcast) or XHR
        // (e.g. /refresh's HX-Retarget header).
        function maybeSync(evt) {
          if (evt.target && evt.target.id === "error-banner") syncVisibility();
        }
        document.body.addEventListener("htmx:afterSwap", maybeSync);
        document.body.addEventListener("htmx:afterSettle", maybeSync);

        document.addEventListener("DOMContentLoaded", syncVisibility);
        setInterval(tick, 30_000);
      })();

      // Settings modal: open/close, fetch repos, render checkbox list,
      // persist toggles to localStorage, re-distribute the board on change.
      (function () {
        var modal = document.getElementById("settings-modal");
        var openBtn = document.getElementById("open-settings");
        var closeBtn = document.getElementById("close-settings");
        var list = document.getElementById("settings-repo-list");
        if (!modal || !openBtn || !closeBtn || !list) return;

        function escapeHtml(str) {
          return String(str).replace(/[&<>"']/g, function (c) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c];
          });
        }

        function renderRows(repos) {
          var ignored = ignoreStore.get();
          if (!repos.length) {
            list.innerHTML =
              '<li class="settings-empty">No open PRs in any repo.</li>';
            return;
          }
          list.innerHTML = repos
            .map(function (r) {
              var isIgnored = ignored.has(r.repo);
              return (
                '<li class="settings-row">' +
                '<label>' +
                '<input type="checkbox" name="ignore" value="' +
                escapeHtml(r.repo) +
                '"' +
                (isIgnored ? " checked" : "") +
                ">" +
                '<span class="settings-repo">' +
                escapeHtml(r.repo) +
                "</span>" +
                '<span class="settings-count">' +
                r.count +
                "</span>" +
                "</label>" +
                "</li>"
              );
            })
            .join("");
        }

        function loadAndRender() {
          list.innerHTML =
            '<li class="settings-empty">Loading repos...</li>';
          fetch("/repos", { headers: { Accept: "application/json" } })
            .then(function (r) {
              if (!r.ok) throw new Error("HTTP " + r.status);
              return r.json();
            })
            .then(renderRows)
            .catch(function () {
              list.innerHTML =
                '<li class="settings-empty">Couldn\'t load repos. Try again.</li>';
            });
        }

        function open() {
          loadAndRender();
          if (typeof modal.showModal === "function") {
            modal.showModal();
          } else {
            modal.setAttribute("open", "");
          }
        }
        function close() {
          if (typeof modal.close === "function") {
            modal.close();
          } else {
            modal.removeAttribute("open");
          }
        }

        openBtn.addEventListener("click", open);
        closeBtn.addEventListener("click", close);

        // Backdrop click closes (clicks land on <dialog> itself, not its
        // children, when they hit the ::backdrop area).
        modal.addEventListener("click", function (evt) {
          if (evt.target === modal) close();
        });

        list.addEventListener("change", function (evt) {
          var t = evt.target;
          if (
            !t ||
            t.tagName !== "INPUT" ||
            t.type !== "checkbox" ||
            t.name !== "ignore"
          )
            return;
          ignoreStore.toggle(t.value, t.checked);
          if (typeof window.__betterGhDistribute === "function") {
            window.__betterGhDistribute();
          }
          if (typeof window.__betterGhDistributeReviews === "function") {
            window.__betterGhDistributeReviews();
          }
        });
      })();

      // Merge button (per card in the APPROVED column). Destructive, so
      // confirm() first; on success, swap the button for a "MERGED"
      // pill and let the next SSE push remove the card from the board.
      (function () {
        function flashError(btn, message) {
          var prev = btn.getAttribute("title");
          btn.classList.add("is-error");
          btn.disabled = false;
          btn.setAttribute("title", message || "Couldn't merge.");
          setTimeout(function () {
            btn.classList.remove("is-error");
            if (prev) btn.setAttribute("title", prev);
          }, 4000);
        }

        function flipToMerged(btn) {
          var pill = document.createElement("span");
          pill.className = "merge-button is-merged";
          pill.setAttribute("aria-disabled", "true");
          pill.innerHTML = 'MERGED <span aria-hidden="true">&check;</span>';
          btn.replaceWith(pill);
        }

        document.body.addEventListener("click", function (evt) {
          var btn =
            evt.target &&
            evt.target.closest &&
            evt.target.closest(".merge-button");
          if (!btn || btn.disabled || btn.classList.contains("is-merged")) return;
          evt.preventDefault();
          var repo = btn.getAttribute("data-pr-repo") || "";
          var number = btn.getAttribute("data-pr-number") || "";
          var title = btn.getAttribute("data-pr-title") || ("#" + number);
          var slash = repo.indexOf("/");
          if (slash < 0 || !number) return;

          if (
            !window.confirm(
              "Merge \"" + title + "\" (#" + number + ") into the base branch?"
            )
          ) {
            return;
          }

          var owner = repo.slice(0, slash);
          var name = repo.slice(slash + 1);
          btn.disabled = true;
          fetch(
            "/pulls/" +
              encodeURIComponent(owner) +
              "/" +
              encodeURIComponent(name) +
              "/" +
              encodeURIComponent(number) +
              "/merge",
            { method: "POST" }
          )
            .then(function (r) {
              if (!r.ok) {
                return r.text().then(function (t) {
                  throw new Error(t || "HTTP " + r.status);
                });
              }
              flipToMerged(btn);
            })
            .catch(function (err) {
              flashError(btn, String(err && err.message ? err.message : err));
            });
        });
      })();

      // Draft -> Ready button. Confirms first (flipping to ready
      // notifies reviewers), POSTs to the backend, and on success
      // removes the button optimistically -- the next SSE push will
      // refresh the rest of the card (column placement, etc).
      (function () {
        function flashError(btn, message) {
          var prev = btn.getAttribute("title");
          btn.classList.add("is-error");
          btn.disabled = false;
          btn.setAttribute("title", message || "Couldn't mark as ready.");
          setTimeout(function () {
            btn.classList.remove("is-error");
            if (prev) btn.setAttribute("title", prev);
          }, 4000);
        }

        document.body.addEventListener("click", function (evt) {
          var btn =
            evt.target &&
            evt.target.closest &&
            evt.target.closest(".draft-button");
          if (!btn || btn.disabled) return;
          evt.preventDefault();
          var repo = btn.getAttribute("data-pr-repo") || "";
          var number = btn.getAttribute("data-pr-number") || "";
          var slash = repo.indexOf("/");
          if (slash < 0 || !number) return;

          if (
            !window.confirm(
              "Mark #" + number + " as ready for review?"
            )
          ) {
            return;
          }

          var owner = repo.slice(0, slash);
          var name = repo.slice(slash + 1);
          btn.disabled = true;
          fetch(
            "/pulls/" +
              encodeURIComponent(owner) +
              "/" +
              encodeURIComponent(name) +
              "/" +
              encodeURIComponent(number) +
              "/ready-for-review",
            { method: "POST" }
          )
            .then(function (r) {
              if (!r.ok) {
                return r.text().then(function (t) {
                  throw new Error(t || "HTTP " + r.status);
                });
              }
              btn.remove();
            })
            .catch(function (err) {
              flashError(btn, String(err && err.message ? err.message : err));
            });
        });
      })();

      // Request-review button. POSTs to the backend, then optimistically
      // flips the button into the "requested" chip; SSE will overwrite
      // with authoritative state on the next poll.
      (function () {
        function flipToRequested(btn) {
          var chip = document.createElement("span");
          chip.className = "chip chip--review";
          chip.setAttribute(
            "title",
            btn.getAttribute("title") || "Review requested"
          );
          chip.innerHTML =
            '<span class="chip-key">R</span><span aria-hidden="true">&check;</span>';
          btn.replaceWith(chip);
        }

        function flashError(btn, message) {
          var prev = btn.getAttribute("title");
          btn.classList.add("is-error");
          btn.setAttribute("title", message || "Couldn't request review.");
          setTimeout(function () {
            btn.classList.remove("is-error");
            if (prev) btn.setAttribute("title", prev);
          }, 2400);
        }

        document.body.addEventListener("click", function (evt) {
          var btn =
            evt.target &&
            evt.target.closest &&
            evt.target.closest(".review-request");
          if (!btn || btn.disabled) return;
          evt.preventDefault();
          var repo = btn.getAttribute("data-pr-repo") || "";
          var number = btn.getAttribute("data-pr-number") || "";
          var slash = repo.indexOf("/");
          if (slash < 0 || !number) return;
          var owner = repo.slice(0, slash);
          var name = repo.slice(slash + 1);
          btn.disabled = true;
          fetch(
            "/pulls/" +
              encodeURIComponent(owner) +
              "/" +
              encodeURIComponent(name) +
              "/" +
              encodeURIComponent(number) +
              "/request-review",
            { method: "POST" }
          )
            .then(function (r) {
              if (!r.ok) {
                return r.text().then(function (t) {
                  throw new Error(t || "HTTP " + r.status);
                });
              }
              flipToRequested(btn);
            })
            .catch(function (err) {
              btn.disabled = false;
              flashError(btn, String(err && err.message ? err.message : err));
            });
        });
      })();

      // Copy-preview-URL button. Delegated on body so it survives every
      // SSE swap of #pr-stream without re-binding listeners.
      (function () {
        function fallbackCopy(text) {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          var ok = false;
          try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
          document.body.removeChild(ta);
          return ok;
        }

        function flashCopied(btn) {
          btn.classList.add("is-copied");
          setTimeout(function () {
            btn.classList.remove("is-copied");
          }, 1200);
        }

        document.body.addEventListener("click", function (evt) {
          var btn =
            evt.target &&
            evt.target.closest &&
            evt.target.closest(".preview-copy");
          if (!btn) return;
          evt.preventDefault();
          var url = btn.getAttribute("data-copy");
          if (!url) return;
          if (
            navigator.clipboard &&
            typeof navigator.clipboard.writeText === "function"
          ) {
            navigator.clipboard
              .writeText(url)
              .then(function () { flashCopied(btn); })
              .catch(function () {
                if (fallbackCopy(url)) flashCopied(btn);
              });
          } else if (fallbackCopy(url)) {
            flashCopied(btn);
          }
        });
      })();
    </script>
  </body>
</html>
