<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111111" />
    <title>SIGN IN &middot; BETTER//GH</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script>
      // Mirror the dashboard's pre-paint theme bootstrap so the login
      // page follows the OS preference without a flash of the wrong theme.
      (function () {
        try {
          if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {
          /* matchMedia unavailable -- leave light */
        }
      })();
    </script>
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <span class="brand-mark brand-mark--large" aria-hidden="true">
        <span class="shape shape--circle"></span>
        <span class="shape shape--square"></span>
        <span class="shape shape--triangle"></span>
      </span>
      <h1 class="brand-title auth-title">
        BETTER<span class="slash">//</span>GH
      </h1>
      <p class="auth-tagline">
        A clearer, calmer view of your open pull requests.
      </p>

      <a class="btn btn--signin" href="/auth/start">
        <svg
          class="signin-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
          focusable="false"
        >
          <path
            fill="currentColor"
            d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55 0-.27-.01-1.17-.02-2.12-3.2.69-3.88-1.36-3.88-1.36-.52-1.32-1.27-1.68-1.27-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.69 1.25 3.35.95.1-.74.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.46.11-3.04 0 0 .97-.31 3.18 1.18.92-.26 1.92-.39 2.9-.4.98.01 1.98.14 2.91.4 2.2-1.49 3.17-1.18 3.17-1.18.63 1.58.23 2.75.11 3.04.74.81 1.18 1.84 1.18 3.1 0 4.42-2.69 5.39-5.26 5.68.41.36.77 1.05.77 2.12 0 1.53-.01 2.76-.01 3.13 0 .3.21.66.8.55C20.21 21.39 23.5 17.08 23.5 12 23.5 5.65 18.35.5 12 .5Z"
          />
        </svg>
        SIGN IN WITH GITHUB
      </a>

      <p class="auth-scopes">
        Requests <code>repo</code> + <code>read:org</code>. Your token is
        signed into an HttpOnly cookie; nothing is stored server-side.
      </p>
    </main>

    <footer class="auth-footer">
      <a href="https://github.com/settings/applications" target="_blank" rel="noopener">
        Manage app permissions on GitHub &rsaquo;
      </a>
    </footer>
  </body>
</html>
