[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "better-gh-backend"
version = "0.1.0"
description = "FastAPI backend for the better-gh dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "jinja2",
    "sse-starlette",
    "python-dotenv",
    "pydantic",
    "pydantic-settings",
    "itsdangerous",
]

[project.scripts]
better-gh = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]
