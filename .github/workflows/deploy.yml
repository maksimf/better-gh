name: deploy

# Build + push the container image to ECR on every push to main. App
# Runner has ``AutoDeploymentsEnabled=true`` on the gh-dashboard service
# and watches ``gh-dashboard:latest`` -- so once the push completes,
# the new image rolls out to https://gh.clearesthealth.com on App
# Runner's own ~1-3 min cadence. Manual trigger is also exposed so we
# can re-deploy without pushing a commit if something needs to be
# nudged.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy in flight at a time. Newer pushes cancel the in-flight
# run so we don't queue up redundant builds while iterating.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # ``id-token: write`` is what lets the workflow exchange its GitHub
  # OIDC token for an AWS session via configure-aws-credentials.
  id-token: write
  contents: read

jobs:
  test:
    name: backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install backend (editable) + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: pytest
        run: pytest -q

  build-and-push:
    name: build + push image to ECR
    needs: test
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "584641603422"
      ECR_REPOSITORY: gh-dashboard
      # Runner is Ubuntu x86_64; App Runner instances are x86_64; we
      # could skip the explicit --platform but keeping it explicit
      # documents intent and prevents surprises if GitHub ever swaps
      # the default runner architecture under us.
      IMAGE_PLATFORM: linux/amd64
    steps:
      - uses: actions/checkout@v4

      - name: configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::584641603422:role/gh-dashboard-ci
          aws-region: ${{ env.AWS_REGION }}

      - name: login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: build + push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.IMAGE_PLATFORM }}
          push: true
          # Two tags: the immutable commit SHA (so rollbacks / audits
          # can pin to a specific commit) and ``latest`` (which App
          # Runner watches via AutoDeploymentsEnabled).
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          # Pull from the registry between runs to keep layer reuse
          # working across the ephemeral runner filesystem.
          cache-from: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:buildcache,mode=max

      - name: summary
        run: |
          echo "### Pushed to ECR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.ECR_REPOSITORY }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.ECR_REPOSITORY }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "App Runner auto-deploys from \`:latest\` within ~1-3 min." >> $GITHUB_STEP_SUMMARY
          echo "Service status: <https://us-east-1.console.aws.amazon.com/apprunner/home?region=us-east-1#/services>" >> $GITHUB_STEP_SUMMARY
